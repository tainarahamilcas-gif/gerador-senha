<!DOCTYPE>
<html lang="pt-br">

<herad>
    <meta charset=" UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <section class="conteudo">
            <div class="conteudo-titulo">
                <img src="unlock.svg" alg="cadeado fechado">
                <h2 class="titulo-principal">Gerador de senha</h2>
                <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
            </div>
            <div class="conteudo-senha">
                <label for="senha">senha</label>
                <input name="senha" type="text" id="campo-senha" readonly>
            </div>
            <div class="parametro">
                <h3 class="parametro-titulo">personalize sua senha</h3>         
               <div class= "parametro-coluna__senha">
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo"> Número de caracteres </h4>
            <div class= "parametro-senha-botao" >-</p>
<button class="parametro-senha-botao__texto">/p>
           <p class=" parametro-senha__botao">12</p>
<button class="parametro-senha__botao"></button>
        </div>
        </div>
        <div class="parametro-senha">
         <h4 class="parametro-senha__titulo">Caracteristicas da senha</h4>
        <div class="parametro-senha-checkbox">
<input name="maiusculo" type="chackbox" class="checkbox" checked>
<label for="maiusculo">letras maiúsculas</label>
        </div>
        <div class="parametro-senha-checkbox">
            <input name="minusculo" type="chackbox" class="checkbox" checked>
<label for="minusculo">letras minúsculo</label>
        </div>
         <div class="parametro-senha-checkbox">
            <input name="numero" type="chackbox" class="checkbox" checked>
<label for="numero">número</label>
        </div>
         <div class="parametro-senha-checkbox">
            <input name="simbolo" type="chackbox" class="checkbox" checked>
<label for="simbolo">símbolos</label>
        </div>
            </div>
            <div class="parametro-senha">
                <h4 class="parametro-senha__titulo">força de senha</h4>
            <div class="barra"></div>
            <div class="forca fraca"></div>
            <div class="parametro-senha-textos">
                <p>fraca</p>
                <p>media</p>
                <p>forte</p>

            </div>
            </div>
            </div>
        </section>
        <script src="main.js"></script>
        </body>

        </html
